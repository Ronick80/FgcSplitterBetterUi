name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # EngineTests call the real FgcCore.dll against the machine's drivers, so they stay on the developer's PC.
      - name: Build and test
        run: dotnet test --configuration Release --filter "FullyQualifiedName!~EngineTests"
