name: Release

# Pushing a tag like v0.1.0 builds the app and publishes a GitHub release with the zip attached.
# The version comes from version.txt; the tag must match it. "Run workflow" on the Actions tab does the same
# for the current branch and creates the tag for you.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from version.txt
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$version' in version.txt must look like 1.2.3" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expected = "v${{ steps.version.outputs.version }}"
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag $env:GITHUB_REF_NAME does not match version.txt (expected $expected)" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Fetched once up front so parallel project builds do not each try to download it.
      - name: Fetch the engine
        shell: pwsh
        run: ./scripts/Get-FgcCore.ps1

      # EngineTests call the real FgcCore.dll against the machine's drivers, so they stay on the developer's PC.
      - name: Test
        run: dotnet test --configuration Release --filter "FullyQualifiedName!~EngineTests"

      - name: Package
        shell: pwsh
        run: ./scripts/Publish.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FGC Keyboard Splitter UI ${{ steps.version.outputs.version }}
          body: |
            Windows x64. Unzip and run FgcKeyboardSplitter.exe. It needs the Interception and ScpVBus drivers: the
            Drivers page has a button that runs the bundled FgcDriverSetup.exe (as administrator). The .NET runtime
            is included. The .sha256 file is the checksum of the zip.
          generate_release_notes: true
          files: |
            artifacts/FgcSplitterBetterUi-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/FgcSplitterBetterUi-${{ steps.version.outputs.version }}-win-x64.zip.sha256
